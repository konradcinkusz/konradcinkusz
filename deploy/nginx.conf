server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # No secrets are served from here, but keep the obvious headers on anyway.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Fly health check target. Must not be rewritten by the SPA fallback below.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Data manifest changes on every deploy; do not let a proxy pin it.
    location = /data/portfolio.json {
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
    }

    # Hash routing is used for tabs, so a plain file fallback is enough.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
