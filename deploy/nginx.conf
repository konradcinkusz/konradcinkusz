server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's add_header does not merge: a child block that sets ANY header
    # replaces the parent's whole set, "always" included. So the headers live in
    # one snippet and every block that adds a header of its own includes it again.
    # Without this, the two locations below silently served the manifest and every
    # asset with no security headers at all.
    include /etc/nginx/snippets/security-headers.conf;

    # Fly's health check target. Must not be rewritten by the SPA fallback below,
    # and must not be an index page: a frontend serving a broken bundle still
    # returns 200 for "/", so the check would pass on a white screen.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The manifest changes on every deploy; do not let a proxy pin it.
    location = /data/portfolio.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
    }

    # Tabs are hash-routed, so a plain file fallback is enough.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
