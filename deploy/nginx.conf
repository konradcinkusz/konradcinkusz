server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's add_header does not merge: a child block that sets ANY header
    # replaces the parent's whole set, "always" included. So the headers live in
    # one snippet and every block that adds a header of its own includes it again.
    # Without this, the two locations below silently served the manifest and every
    # asset with no security headers at all.
    include /etc/nginx/snippets/security-headers.conf;

    # Fly's health check target. Must not be rewritten by the SPA fallback below,
    # and must not be an index page: a frontend serving a broken bundle still
    # returns 200 for "/", so the check would pass on a white screen.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The manifest changes on every deploy; do not let a proxy pin it.
    location = /data/portfolio.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|webp)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        expires 7d;
    }

    # Tabs are hash-routed, so a plain file fallback is enough.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The manifest is 1.18 MB of JSON and it is the whole payload, so these three
    # settings are the page's load time. All were left at their nginx defaults,
    # and two of the defaults are wrong here.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Default is 1, the weakest zlib has. Measured on the real file:
    #   level 1  435 KiB      level 6  357 KiB      level 9  354 KiB
    # Level 6 is 78 KiB smaller than the default for compression work that does
    # not register on a file this size; 9 buys 3 KiB more and is not worth it.
    gzip_comp_level 6;

    # Default is `off`, which means: do not compress a response to any request
    # carrying a Via header. Fly's edge proxies every request to the machine, so
    # the default would ship the manifest UNCOMPRESSED in production while
    # compressing it perfectly on localhost — the failure mode that only appears
    # once deployed and never in a local test.
    gzip_proxied any;

    # So a cache cannot hand a gzipped body to a client that did not ask for one.
    gzip_vary on;
}
