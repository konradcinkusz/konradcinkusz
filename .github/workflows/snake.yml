name: Contribution snake

# Renders the contribution calendar as the snake animation the README embeds
# from the `output` branch (light and dark variants). Purely cosmetic; it never
# touches main.

on:
  schedule:
    - cron: "23 4 * * *"   # daily 04:23 UTC, off the hour
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
