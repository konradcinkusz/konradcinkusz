name: README latest videos

# The profile README shows the channel's six newest uploads. Nobody keeps a
# thumbnail grid current by hand, so this rewrites the block between the
# YOUTUBE markers from the channel's public feed and commits only on change.

on:
  schedule:
    - cron: "41 5 * * 1"   # Mondays 05:41 UTC, off the hour
  workflow_dispatch:

concurrency:
  group: readme-videos
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # YOUTUBE_CHANNEL_ID is optional: with it set as a repository variable the
      # script skips scraping the handle page, which is the only fragile step.
      - name: Rewrite the video block
        env:
          YOUTUBE_CHANNEL_ID: ${{ vars.YOUTUBE_CHANNEL_ID }}
        run: node scripts/update-readme-videos.mjs --handle @_dev_insight

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "Video block already current."
            exit 0
          fi
          git add README.md
          git commit -m "chore: latest videos $(date -u +%Y-%m-%d)"
          git push
