name: Deploy portfolio to Fly.io

# A deploy is an act, and a tag is the record of it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual deploy"
        required: true
        type: string

concurrency:
  group: flyio-portfolio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site/data/portfolio.json
        run: node scripts/validate-portfolio.mjs

  deploy:
    name: Build and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fail early on a missing deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not set. See flyio/SECRETS.md."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app if it does not exist yet
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status --app konrad-portfolio >/dev/null 2>&1; then
            echo "App missing; creating it."
            flyctl apps create konrad-portfolio --org personal
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config flyio/portfolio.fly.toml \
                        --remote-only \
                        --wait-timeout 300

      # The health check proves nginx is up. It does not prove the manifest shipped,
      # and it does not prove BOTH languages shipped — a truncated upload or a
      # builder run against a half-translated tree still serves a valid JSON file
      # that a Polish reader would never notice was missing its English half.
      - name: Verify the manifest is served
        run: |
          probe='let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{
            const j=JSON.parse(s);
            const langs=Object.keys(j).filter(k=>k!=="ui");
            const bad=langs.filter(l=>!j[l].repos||j[l].repos.length<30);
            const ui=langs.filter(l=>!j.ui||!j.ui[l]||Object.keys(j.ui[l]).length<100);
            console.log(JSON.stringify({langs,repos:langs.map(l=>j[l].repos.length),bad,ui}));
          })'
          for i in 1 2 3 4 5; do
            out=$(curl -fsS --max-time 30 https://konrad-portfolio.fly.dev/data/portfolio.json | node -e "$probe") && break
            echo "attempt $i failed, retrying"; sleep 10
          done
          echo "served: ${out:-nothing}"
          node -e '
            const r = JSON.parse(process.argv[1] || "{}");
            const want = ["pl", "en"];
            for (const l of want) if (!(r.langs || []).includes(l)) { console.error(`::error::the served manifest has no "${l}" bundle`); process.exit(1); }
            if ((r.bad || []).length) { console.error(`::error::these languages served fewer than 30 repositories: ${r.bad.join(", ")}`); process.exit(1); }
            if ((r.ui || []).length) { console.error(`::error::these languages served an empty or short interface bundle: ${r.ui.join(", ")}`); process.exit(1); }
            console.log(`${r.langs.length} language(s) served: ${r.langs.map((l, i) => `${l} (${r.repos[i]} repos)`).join(", ")}`);
          ' "${out:-}"
