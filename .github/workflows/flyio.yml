name: Deploy portfolio to Fly.io

# A deploy is an act, and a tag is the record of it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this manual deploy"
        required: true
        type: string

concurrency:
  group: flyio-portfolio
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate site/data/portfolio.json
        run: |
          # --check FIRST. Validation proves the committed manifest is well formed;
          # it says nothing about whether it matches data/. A tag on a commit that
          # edited data/ and forgot to rebuild would deploy a stale manifest, and
          # every check after this one — including the post-deploy assertion — would
          # pass on it, because stale and correct look identical from outside.
          node scripts/build-manifest.mjs --check
          node scripts/validate-portfolio.mjs
          node scripts/i18n-audit.mjs

  deploy:
    name: Build and deploy
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Fail early on a missing deploy token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::error::FLY_API_TOKEN is not set. See flyio/SECRETS.md."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create the app if it does not exist yet
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if ! flyctl status --app konrad-portfolio >/dev/null 2>&1; then
            echo "App missing; creating it."
            flyctl apps create konrad-portfolio --org personal
          fi

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl deploy --config flyio/portfolio.fly.toml \
                        --remote-only \
                        --wait-timeout 300

      # The health check proves nginx is up. It does not prove the manifest
      # shipped, and it does not prove BOTH languages shipped. The assertion is a
      # script rather than inline shell because the same check runs against the
      # container in CI, and two hand-written copies had already drifted apart
      # once — one of them still asserting a manifest shape that no longer exists.
      - name: Verify the manifest is served
        run: node scripts/assert-served-manifest.mjs https://konrad-portfolio.fly.dev/data/portfolio.json
